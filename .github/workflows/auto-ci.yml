name: Auto CI/CD Workflow (AI-Native Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🧱 Python Section
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Tests with Coverage
        run: |
          coverage run -m pytest
          coverage xml
        continue-on-error: false

      # 🧱 Node.js Section
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests & Coverage
        run: |
          npm test -- --coverage
          cat ./coverage/lcov.info | grep -i "SF:" || true

      # 🧱 Go Section
      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Unit Tests
        run: go test ./... -v -coverprofile=coverage.out

      # 🧱 Java Section (Temurin)
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'          # ✅ حیاتی برای Runner v2.329.0
          java-version: '21'
          java-package: 'jdk'
          cache: 'maven'
          check-latest: false
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          overwrite-settings: true

      - name: Build & Test Java (Maven)
        run: mvn -B verify

      # 🧱 Artifact & Docker Build
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}:latest

      # 🧱 Upload Coverage Reports
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.out
            ./coverage/
          retention-days: 7

  # 🛡️ CodeQL Security
  code-scanning:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python, javascript, go, java'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 🤖 Dependabot Auto-Update
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Dependabot auto-merge
        uses: fastify/github-action-auto-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

