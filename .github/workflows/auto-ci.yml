name: Auto CI with Cache and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 📦 مرحله ۱: دریافت سورس
      - name: Checkout source
        uses: actions/checkout@v4

      # ⚙️ مرحله ۲: Cache وابستگی‌ها برای سرعت بیشتر
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/go-build
            ~/.m2
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt','**/package-lock.json','**/go.mod','**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # 📘 مرحله ۳: تنظیم محیط‌های اجرا برای زبان‌های مختلف
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - uses: actions/setup-java@v4
        with:
          java-version: 21

      # 🔧 مرحله ۴: نصب وابستگی‌ها
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package.json ]; then npm install --silent; fi
          if [ -f go.mod ]; then go mod tidy; fi
          if [ -f pom.xml ]; then mvn install -q; fi

      # 🧪 مرحله ۵: اجرای تست‌ها و گزارش پوشش کد
      - name: Run Tests & Generate Coverage Report
        run: |
          echo "Running tests and calculating coverage..."
          if [ -f requirements.txt ]; then pip install pytest coverage; coverage run -m pytest; coverage xml -o coverage-python.xml; coverage report -m; fi
          if [ -f package.json ]; then npm install --save-dev jest nyc; npx nyc --reporter=text --reporter=lcov npm test || echo "No JS tests"; fi
          if [ -f go.mod ]; then go test -coverprofile=coverage-go.out ./...; go tool cover -func coverage-go.out; fi
          if [ -f pom.xml ]; then mvn test jacoco:report; echo "Java coverage report generated."; fi

      # 📤 مرحله ۶: ذخیره گزارش پوشش کدها
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-python.xml
            coverage-go.out
            coverage/
            target/site/jacoco/
