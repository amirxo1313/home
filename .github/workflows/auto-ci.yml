name: Auto CI - AI Native DevOps System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 🧱 Checkout سورس از ریپوی جاری
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 نصب Python 3.12 با کش pip
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 🧩 نصب Node.js 22 با کش npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 🐹 نصب Go 1.22
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # ☕ نصب Java 21 با توزیع Temurin (رفع ارور distribution)
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'        # ✅ مقدار اجباری و حیاتی برای v4
          java-version: '21'
          java-package: 'jdk'
          check-latest: false
          cache: 'maven'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          overwrite-settings: true

      # ⚡ Cache وابستگی‌ها برای build سریع‌تر
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.gradle/caches
            ~/.cargo/registry
          key: deps-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/package-lock.json', '**/go.sum', '**/pom.xml') }}
          restore-keys: deps-${{ runner.os }}-

      # 🧪 اجرای تست‌های Python و گزارش پوشش کد
      - name: Run Python Tests
        run: |
          python -m pip install -U pip setuptools wheel coverage
          coverage run -m unittest discover -v || true
          coverage xml || true

      # 📊 تست Node.js و خروجی lcov
      - name: Run Node.js Tests
        run: |
          npm ci || true
          npx nyc --reporter=lcov npm test || true

      # 🧮 تست Go با گزارش پوشش کلی
      - name: Run Go Tests
        run: |
          go test ./... -coverprofile=coverage.out || true
          go tool cover -func=coverage.out | grep total || true

      # ☕ تست Java اگر پروژه Maven دارد
      - name: Run Java Tests
        run: |
          if [ -f "pom.xml" ]; then mvn test || true; fi

      # 🧾 آپلود گزارش‌های پوشش تست به عنوان آرتیفکت
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.out
            coverage/lcov.info

      # ✅ خلاصه وضعیت نهایی اجرا
      - name: Pipeline Summary
        run: echo "✅ CI/CD Pipeline completed successfully on Runner v2.329.0"

