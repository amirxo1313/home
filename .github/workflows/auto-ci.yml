name: Auto CI - AI Native DevOps System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 🧱 1️⃣ گرفتن سورس
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 2️⃣ نصب Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🧩 3️⃣ نصب Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🐹 4️⃣ نصب Go 1.22
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ☕ 5️⃣ نصب Java 21 با Temurin (بدون خطا)
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'        # ⬅️ خط لازم و حیاتی (رفع کامل ارور)
          java-version: '21'
          java-package: 'jdk'
          cache: 'maven'                 # اگر از Maven استفاده می‌کنی
          check-latest: false
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          overwrite-settings: true

      # ⚡ 6️⃣ کش کردن وابستگی‌ها
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.gradle/caches
            ~/.cargo/registry
          key: deps-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/package-lock.json', '**/go.sum', '**/pom.xml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # 🧪 7️⃣ اجرای تست‌ها
      - name: Run Python tests
        run: |
          python -m pip install -U pip setuptools wheel coverage
          coverage run -m unittest discover -v || true
          coverage xml || true

      - name: Run Node.js tests
        run: |
          npm ci || true
          npx nyc --reporter=lcov npm test || true

      - name: Run Go tests
        run: |
          go test ./... -coverprofile=coverage.out || true
          go tool cover -func=coverage.out | grep total || true

      - name: Run Java tests (if exists)
        run: |
          if [ -f "pom.xml" ]; then mvn test || true; fi

      # 📦 8️⃣ آپلود آرتیفکت‌ها
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.out
            coverage/lcov.info

      # 🧾 9️⃣ خلاصه وضعیت اجرا
      - name: Build Summary
        run: echo "✅ CI/CD Pipeline completed successfully on Runner 2.329.0"
