name: Auto Intelligent CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [java, node, python, go]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/.cache/go-build
            ~/.m2
          key: ${{ runner.os }}-${{ matrix.language }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt', '**/go.sum', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.language }}-

      - name: Run build & tests
        run: |
          echo "Running build and tests for ${{ matrix.language }}..."
          if [ "${{ matrix.language }}" == "java" ]; then
            ./gradlew clean build || echo "No Gradle project found."
          elif [ "${{ matrix.language }}" == "node" ]; then
            npm install && npm test || echo "No Node tests defined."
          elif [ "${{ matrix.language }}" == "python" ]; then
            pip install -r requirements.txt || echo "No requirements.txt found."
            pytest || echo "No Python tests found."
          elif [ "${{ matrix.language }}" == "go" ]; then
            go mod tidy
            go test ./... || echo "No Go tests found."
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.language }}
          path: |
            **/build/**
            **/dist/**
            **/target/**
            **/__pycache__/**

  security-codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect supported languages for CodeQL
        id: detect
        run: |
          echo "Checking for CodeQL-supported files..."
          patterns=("*.js" "*.ts" "*.jsx" "*.tsx" "*.py" "*.java" "*.go" "*.cs" "*.cpp" "*.c" "*.rb")
          supported=false
          for p in "${patterns[@]}"; do
            if git ls-files -- "$p" | grep -q .; then
              supported=true
              echo "Found supported language files matching: $p"
              break
            fi
          done
          echo "supported=$supported" >> $GITHUB_OUTPUT
          if [ "$supported" = "true" ]; then
            echo "CodeQL-supported languages detected. Proceeding with analysis."
          else
            echo "No CodeQL-supported languages found. Will skip CodeQL steps."
          fi

      - name: Skip CodeQL if no supported languages found
        if: steps.detect.outputs.supported != 'true'
        run: |
          echo "No CodeQL-supported languages found in the repository. Skipping CodeQL analysis."

      - name: Initialize CodeQL
        if: steps.detect.outputs.supported == 'true'
        uses: github/codeql-action/init@v3

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.supported == 'true'
        uses: github/codeql-action/analyze@v3

