name: Auto CI - AI Native Environment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout سورس‌کد به آخرین commit
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Setup Python 3.12.12 (latest stable)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🧱 Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🪞 Setup GoLang 1.22
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ☕ Setup Java (Temurin JDK 21)
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'        # ضروری برای Runner 2.329.0 ✅
          java-version: '21'
          java-package: 'jdk'
          cache: 'maven'                 # سرعت بیشتر در بیلدهای مکرر
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          overwrite-settings: true

      # ⚡ Cache وابستگی‌ها بین بیلدها
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.gradle/caches
            ~/.cargo/registry
          key: deps-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/package-lock.json', '**/go.sum', '**/pom.xml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # 🧪 اجرای تست‌ها برای هر زبان
      - name: Run Python tests
        run: |
          python -m pip install -U pip setuptools wheel coverage
          coverage run -m unittest discover -v
          coverage xml

      - name: Run Node.js tests
        run: |
          npm ci
          npx nyc --reporter=lcov npm test

      - name: Run Go tests
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | grep total

      - name: Run Java tests (if exists)
        run: |
          if [ -f "pom.xml" ]; then mvn test; fi

      # 📦 آپلود آرتیفکت‌ها
      - name: Upload test coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.out
            coverage/lcov.info

      # ✨ خلاصه وضعیت بیلد
      - name: Build summary
        run: |
          echo "✅ CI/CD completed successfully for Python, Node.js, Go, and Java"

